name: pulse

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_test"]
      interval: 3s
      timeout: 3s
      retries: 20
    profiles: ["test"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@db:5432/pulse
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SEED_DEMO: ${SEED_DEMO:-1}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      demo-sites:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20

  scheduler:
    build: ./backend
    entrypoint: ["./entrypoint.sh", "scheduler"]
    environment:
      <<: *backend_env
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  demo-sites:
    build: ./demo-sites
    ports:
      - "8090:8090"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
