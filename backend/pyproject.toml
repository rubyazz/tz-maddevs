[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse — website uptime monitor (MadDevs test task), FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1",
    "aiosmtplib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "db: requires a live PostgreSQL at TEST_DATABASE_URL (skipped otherwise)",
]
